name: benchmark-smoke

# Manual only. There is no scheduled or push trigger here on purpose: a
# workflow that can spend money or occupy a licensed machine should start with
# a person deciding to start it.
#
# Four paths, in increasing order of what they need:
#
#   validate-only      zero cost, GitHub-hosted. Clones the pinned upstream,
#                      validates the inputs, compiles the plan and builds the
#                      exact upstream command — without running it.
#   oracle-controls    zero *model* cost, self-hosted. `harbor run -c` with
#                      Harbor's built-in oracle/nop agents. Needs a runner and
#                      Docker; no model key.
#   agent (oragentbench)  real cost. Runs upstream's own Harbor wrapper.
#   agent (frontieror)    real cost. Runs upstream's official trusted-agent
#                      entry point, and only on a performance-isolated runner.
#
# Every precondition fails closed. A missing secret, licence, image, runner or
# isolation guarantee stops the job; nothing degrades into a run that looks
# successful. Command construction lives in `orbenchlab.execution` and is unit
# tested, so what runs here is what the tests asserted.
on:
  workflow_dispatch:
    inputs:
      integration:
        description: Integration to smoke
        required: true
        default: oragentbench
        type: choice
        options: [oragentbench, frontieror]
      mode:
        description: What to actually do
        required: true
        default: validate-only
        type: choice
        options: [validate-only, oracle-controls, agent]
      task:
        description: >-
          ORAgentBench: task directory name under harbor_tasks/, validated
          against the pinned checkout.
        required: false
        default: additive_microfactory_order_planning
      scaffold:
        description: "ORAgentBench: agent scaffold"
        required: false
        default: claude-code
        type: choice
        options: [claude-code, codex, mini-swe-agent]
      scaffold_version:
        description: "ORAgentBench: exact released scaffold CLI version"
        required: false
        default: ""
      model:
        description: "ORAgentBench: exact pinned model id (no floating aliases)"
        required: false
        default: ""
      campaign_date:
        description: Campaign date, YYYY-MM-DD. Campaign ids derive from it.
        required: true
        default: "2026-08-22"
      paper_id:
        description: "FrontierOR: paper id, validated against paper_meta_info.json"
        required: false
        default: bierwirth2017
      primary_model:
        description: "FrontierOR: full provider/model route, e.g. openai/gpt-5.4"
        required: false
        default: ""
      stage1_instances:
        description: "FrontierOR: stage-1 instances (space separated)"
        required: false
        default: tiny
      dev_set:
        description: "FrontierOR: dev instances (space separated)"
        required: false
        default: large_1
      test_set:
        description: "FrontierOR: held-out test instances; must not overlap the above"
        required: false
        default: large_2
      run_id:
        description: "FrontierOR: upstream run id"
        required: false
        default: orbench-agent-smoke
      acknowledge_cost:
        description: >-
          Type "i-accept-model-costs" to run mode=agent. Ignored otherwise.
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # Never cancel in progress: a cancelled benchmark leaves half-written state on
  # the execution host.
  group: benchmark-smoke-${{ inputs.integration }}
  cancel-in-progress: false

jobs:
  preflight:
    # Zero cost, GitHub-hosted, no secrets. Clones the pinned upstream, proves
    # the inputs are valid against it, and prints the exact command the paid
    # jobs will run. If this fails, nothing downstream starts.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      run_controls: ${{ steps.gate.outputs.run_controls }}
      run_agent_oab: ${{ steps.gate.outputs.run_agent_oab }}
      run_agent_fo: ${{ steps.gate.outputs.run_agent_fo }}
      evidence_label: ${{ steps.gate.outputs.evidence_label }}
      # Only these normalized values may cross into either FrontierOR CLI.
      # Raw workflow_dispatch strings never become argv.
      stage1_instances: ${{ steps.frontieror-instances.outputs.stage1_instances }}
      dev_set: ${{ steps.frontieror-instances.outputs.dev_set }}
      test_set: ${{ steps.frontieror-instances.outputs.test_set }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Refuse to run from a fork
        if: github.event.repository.fork
        run: |
          echo "::error::forks do not receive secrets and must not schedule work on this repository's runners"
          exit 1

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate and normalize FrontierOR instance lists
        id: frontieror-instances
        if: inputs.integration == 'frontieror'
        env:
          STAGE1_INSTANCES: ${{ inputs.stage1_instances }}
          DEV_SET: ${{ inputs.dev_set }}
          TEST_SET: ${{ inputs.test_set }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import sys

          instance_name = re.compile(r"^(?:tiny|large_[1-9][0-9]*)$")
          fields = (
              ("stage1_instances", "stage-1", os.environ["STAGE1_INSTANCES"]),
              ("dev_set", "dev", os.environ["DEV_SET"]),
              ("test_set", "test", os.environ["TEST_SET"]),
          )
          normalized = []
          for output_name, label, raw in fields:
              tokens = raw.split()
              invalid = [token for token in tokens if not instance_name.fullmatch(token)]
              if not tokens or invalid:
                  print(
                      "::error::invalid FrontierOR "
                      f"{label} instance list: every token must be 'tiny' or "
                      f"'large_<N>' with N >= 1; invalid tokens: {invalid!r}",
                      file=sys.stderr,
                  )
                  raise SystemExit(2)
              normalized.append((output_name, " ".join(tokens)))

          # Write nothing unless every list passed. Downstream jobs receive
          # these normalized values, never the raw dispatch strings.
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              for output_name, value in normalized:
                  stream.write(f"{output_name}={value}\n")
          PY

      - name: Clone the pinned upstream commit
        env:
          INTEGRATION: ${{ inputs.integration }}
        run: |
          set -euo pipefail
          bash .github/scripts/clone-upstream.sh "$INTEGRATION" upstream

      - name: Validate inputs and build the upstream command (nothing executed)
        env:
          INTEGRATION: ${{ inputs.integration }}
          MODE: ${{ inputs.mode }}
          TASK: ${{ inputs.task }}
          SCAFFOLD: ${{ inputs.scaffold }}
          SCAFFOLD_VERSION: ${{ inputs.scaffold_version }}
          MODEL: ${{ inputs.model }}
          MODEL_BASE_URL: ${{ vars.MODEL_BASE_URL }}
          CAMPAIGN_DATE: ${{ inputs.campaign_date }}
          PAPER_ID: ${{ inputs.paper_id }}
          PRIMARY_MODEL: ${{ inputs.primary_model }}
          STAGE1_INSTANCES: ${{ steps.frontieror-instances.outputs.stage1_instances }}
          DEV_SET: ${{ steps.frontieror-instances.outputs.dev_set }}
          TEST_SET: ${{ steps.frontieror-instances.outputs.test_set }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p out
          if [ "$INTEGRATION" = "oragentbench" ]; then
            prepare_agent=oracle
            prepare_model=""
            if [ "$MODE" != "oracle-controls" ] && [ -n "$MODEL" ]; then
              prepare_agent="$SCAFFOLD"
              prepare_model="$MODEL"
            elif [ "$MODE" = "agent" ]; then
              echo "::error::mode=agent requires an exact pinned model id"
              exit 1
            fi
            if [ "$prepare_agent" != "oracle" ] && [ -z "$SCAFFOLD_VERSION" ]; then
              echo "::error::a paid ORAgentBench run requires scaffold_version"
              exit 1
            fi
            scaffold_version_args=()
            if [ -n "$SCAFFOLD_VERSION" ]; then
              scaffold_version_args=(--scaffold-version "$SCAFFOLD_VERSION")
            fi
            orbench run oragentbench \
              --source upstream/ORAgentBench \
              --task "$TASK" \
              --agent "$prepare_agent" \
              --model "$prepare_model" \
              "${scaffold_version_args[@]}" \
              --date "$CAMPAIGN_DATE" \
              --workspace out/benchmark-smoke \
              --prepare-only > out/preflight-run.json
          else
            read -r -a stage1_array <<< "$STAGE1_INSTANCES"
            read -r -a dev_array <<< "$DEV_SET"
            read -r -a test_array <<< "$TEST_SET"
            python tools/run_benchmark_smoke.py frontieror \
              --source upstream/FrontierOR \
              --paper-id "$PAPER_ID" \
              --primary-model "$PRIMARY_MODEL" \
              --stage1-instances "${stage1_array[@]}" \
              --dev-set "${dev_array[@]}" \
              --test-set "${test_array[@]}" \
              --run-id "$RUN_ID" \
              --receipt out/preflight-receipt.json \
              --allow-missing-tooling
          fi

      - name: Let upstream's own wrapper prove the compiled config is consumable
        # ORAgentBench only, and still zero cost: `--dry-run` makes upstream's
        # wrapper transform the config, apply dynamic skills and print the
        # `harbor run` command it would execute, then stop. It needs neither
        # Harbor, Docker nor a credential — so a real upstream check runs on
        # every dispatch instead of only on the paid path.
        if: >-
          inputs.integration == 'oragentbench' &&
          inputs.mode != 'oracle-controls' &&
          inputs.model != ''
        env:
          TASK: ${{ inputs.task }}
          SCAFFOLD: ${{ inputs.scaffold }}
          SCAFFOLD_VERSION: ${{ inputs.scaffold_version }}
          MODEL: ${{ inputs.model }}
          MODEL_BASE_URL: ${{ vars.MODEL_BASE_URL }}
          CAMPAIGN_DATE: ${{ inputs.campaign_date }}
        run: |
          set -euo pipefail
          python tools/run_benchmark_smoke.py oragentbench \
            --source upstream/ORAgentBench \
            --task "$TASK" \
            --scaffold "$SCAFFOLD" \
            --model "$MODEL" \
            --scaffold-version "$SCAFFOLD_VERSION" \
            --date "$CAMPAIGN_DATE" \
            --campaign-slug "oab-${SCAFFOLD}-smoke" \
            --output-root out/benchmark-smoke \
            --upstream-dry-run --execute \
            --receipt out/upstream-dry-run-receipt.json

      - name: Gate
        id: gate
        env:
          MODE: ${{ inputs.mode }}
          INTEGRATION: ${{ inputs.integration }}
          ACK: ${{ inputs.acknowledge_cost }}
        run: |
          set -euo pipefail
          run_controls=false
          run_agent_oab=false
          run_agent_fo=false
          # FrontierOR scores a speed term against a reference runtime measured
          # on a pinned core. Nothing produced on a GitHub-hosted runner is
          # comparable to that, so such a run is exploratory by construction.
          evidence_label=exploratory

          case "$MODE" in
            validate-only)
              echo "validate-only: the command above was built and validated, not executed"
              ;;
            oracle-controls)
              if [ "$INTEGRATION" != "oragentbench" ]; then
                echo "::error::oracle/nop controls are Harbor built-ins and apply to Harbor-native integrations; $INTEGRATION is not one"
                exit 1
              fi
              run_controls=true
              ;;
            agent)
              if [ "$ACK" != "i-accept-model-costs" ]; then
                echo "::error::mode=agent spends money; re-dispatch with acknowledge_cost set to i-accept-model-costs"
                exit 1
              fi
              if [ "$INTEGRATION" = "oragentbench" ]; then
                run_agent_oab=true
              else
                run_agent_fo=true
              fi
              ;;
          esac

          echo "run_controls=$run_controls" >> "$GITHUB_OUTPUT"
          echo "run_agent_oab=$run_agent_oab" >> "$GITHUB_OUTPUT"
          echo "run_agent_fo=$run_agent_fo" >> "$GITHUB_OUTPUT"
          echo "evidence_label=$evidence_label" >> "$GITHUB_OUTPUT"

      - name: Upload the plan and the preflight receipts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: preflight-${{ inputs.integration }}
          # Plan, ledger and receipts only. Raw Harbor job bundles never leave
          # the execution host.
          path: |
            out/benchmark-smoke/**/plan/**
            out/preflight-run.json
            out/*receipt.json
          retention-days: 7
          if-no-files-found: warn

  oracle-controls:
    # Zero model cost: oracle and nop are Harbor built-ins. Still needs a real
    # machine, because it builds and runs containers.
    needs: preflight
    if: needs.preflight.outputs.run_controls == 'true'
    runs-on: [self-hosted, orbench-exec]
    timeout-minutes: 90
    environment: controls
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Fail closed on missing execution prerequisites
        run: |
          set -euo pipefail
          missing=0
          command -v docker >/dev/null 2>&1 || { echo "::error::docker is not available on this runner"; missing=1; }
          [ "$missing" -eq 0 ] || exit 1

      - name: Bootstrap the tested runtime and clone the pinned upstream commit
        run: |
          set -euo pipefail
          ./scripts/bootstrap-runner.sh
          export PATH="$PWD/.venv/bin:$PATH"
          command -v harbor >/dev/null 2>&1 || { echo "::error::the harbor CLI is not installed on this runner"; exit 1; }
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          bash .github/scripts/clone-upstream.sh oragentbench upstream

      - name: Run oracle and nop through the one-command lifecycle
        env:
          TASK: ${{ inputs.task }}
          CAMPAIGN_DATE: ${{ inputs.campaign_date }}
          ORBENCH_RUNS_ROOT: ${{ vars.ORBENCH_RUNS_ROOT }}
        run: |
          set -euo pipefail
          export PATH="$PWD/.venv/bin:$PATH"
          RUN_WORKSPACE="$(./scripts/validate-run-workspace.sh "$ORBENCH_RUNS_ROOT" controls)"
          mkdir -p out/share

          export_orbench_shareable() {
            local result_json="$1"
            local destination="$2"
            local run_root
            local workspace_real
            local run_root_real
            run_root=$(.venv/bin/python -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["run_root"])' "$result_json")
            workspace_real=$(realpath "$RUN_WORKSPACE")
            run_root_real=$(realpath "$run_root")
            case "$run_root_real/" in
              "$workspace_real"/*) ;;
              *) echo "::error::refusing to export evidence outside the controlled run workspace"; return 1 ;;
            esac
            orbench export \
              --run-root "$run_root_real" \
              --destination "$destination" > "${result_json%.json}-export.json"
          }

          for agent in oracle nop; do
            orbench doctor oragentbench \
              --source upstream/ORAgentBench \
              --task "$TASK" \
              --agent "$agent" > "out/${agent}-doctor.json"
            orbench run oragentbench \
              --source upstream/ORAgentBench \
              --task "$TASK" \
              --agent "$agent" \
              --date "$CAMPAIGN_DATE" \
              --workspace "$RUN_WORKSPACE" \
              --execute > "out/${agent}-run.json"
            export_orbench_shareable \
              "out/${agent}-run.json" "out/share/${agent}"
          done

      - name: Confirm the share bundle contains no raw Harbor or auth material
        run: |
          set -euo pipefail
          if find out/share -type f \( \
            -name trajectory.json -o \
            -name agent.json -o \
            -name auth.json -o \
            -name '*.log' -o \
            -name config.json -o \
            -name manifest.json -o \
            -name receipt.json -o \
            -name integrity.sha256 \
          \) -print -quit | grep -q .; then
            echo "::error::raw Harbor or auth material reached the share bundle"
            exit 1
          fi

      - name: Upload the shareable control evidence only
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        # Never publish a partial control pair: if either control or the
        # share-bundle guard fails, the evidence remains on the runner.
        if: success()
        with:
          name: controls-evidence
          # Only host-derived normalized evidence and its audit metadata.
          # Raw jobs/, trajectories, logs and credentials stay on the runner.
          path: out/share/**
          retention-days: 14
          if-no-files-found: error

  agent-oragentbench:
    # Real cost. The one-command lifecycle validates the checkout and runner,
    # prepares an auditable workspace, executes upstream Harbor, ingests the
    # result and renders the report before anything is eligible for upload.
    needs: preflight
    if: needs.preflight.outputs.run_agent_oab == 'true'
    # Required reviewers on this environment are what actually stop an
    # unattended spend; the workflow only refuses to proceed without the
    # preconditions.
    environment: benchmark-agent
    runs-on: [self-hosted, orbench-exec]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Fail closed on missing secrets or tooling
        env:
          # Referenced only to test for emptiness; never echoed.
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          MODEL_BASE_URL: ${{ vars.MODEL_BASE_URL }}
        run: |
          set -euo pipefail
          missing=0
          [ -n "${MODEL_API_KEY:-}" ] || { echo "::error::repository secret MODEL_API_KEY is not configured"; missing=1; }
          [ -n "${MODEL_BASE_URL:-}" ] || { echo "::error::repository variable MODEL_BASE_URL is not configured"; missing=1; }
          command -v docker >/dev/null 2>&1 || { echo "::error::docker is not available on this runner"; missing=1; }
          [ "$missing" -eq 0 ] || exit 1

      - name: Bootstrap the tested runtime and clone the pinned upstream commit
        run: |
          set -euo pipefail
          ./scripts/bootstrap-runner.sh
          export PATH="$PWD/.venv/bin:$PATH"
          command -v harbor >/dev/null 2>&1 || { echo "::error::the harbor CLI is not installed on this runner"; exit 1; }
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          bash .github/scripts/clone-upstream.sh oragentbench upstream

      - name: Doctor, run, ingest and export the shareable evidence
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          MODEL_BASE_URL: ${{ vars.MODEL_BASE_URL }}
          TASK: ${{ inputs.task }}
          SCAFFOLD: ${{ inputs.scaffold }}
          SCAFFOLD_VERSION: ${{ inputs.scaffold_version }}
          MODEL: ${{ inputs.model }}
          CAMPAIGN_DATE: ${{ inputs.campaign_date }}
          ACKNOWLEDGE_COST: ${{ inputs.acknowledge_cost }}
          ORBENCH_RUNS_ROOT: ${{ vars.ORBENCH_RUNS_ROOT }}
        run: |
          set -euo pipefail
          export PATH="$PWD/.venv/bin:$PATH"
          RUN_WORKSPACE="$(./scripts/validate-run-workspace.sh "$ORBENCH_RUNS_ROOT" agent)"
          # The exporter creates its destination atomically and deliberately
          # rejects a pre-existing directory with different contents.
          mkdir -p out/share
          orbench doctor oragentbench \
            --source upstream/ORAgentBench \
            --task "$TASK" \
            --agent "$SCAFFOLD" \
            --model "$MODEL" \
            --scaffold-version "$SCAFFOLD_VERSION" \
            --auth-mode api-key \
            --model-base-url "$MODEL_BASE_URL" > out/agent-doctor.json

          orbench run oragentbench \
            --source upstream/ORAgentBench \
            --task "$TASK" \
            --agent "$SCAFFOLD" \
            --model "$MODEL" \
            --scaffold-version "$SCAFFOLD_VERSION" \
            --auth-mode api-key \
            --model-base-url "$MODEL_BASE_URL" \
            --date "$CAMPAIGN_DATE" \
            --workspace "$RUN_WORKSPACE" \
            --execute \
            --acknowledge-cost "$ACKNOWLEDGE_COST" > out/agent-run.json

          run_root=$(.venv/bin/python -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["run_root"])' out/agent-run.json)
          workspace_real=$(realpath "$RUN_WORKSPACE")
          run_root_real=$(realpath "$run_root")
          case "$run_root_real/" in
            "$workspace_real"/*) ;;
            *) echo "::error::refusing to export evidence outside the controlled run workspace"; exit 1 ;;
          esac

          orbench export \
            --run-root "$run_root_real" \
            --destination out/share/agent > out/agent-export.json

          if find out/share -type f \( \
            -name trajectory.json -o \
            -name agent.json -o \
            -name auth.json -o \
            -name '*.log' -o \
            -name config.json -o \
            -name manifest.json -o \
            -name receipt.json -o \
            -name integrity.sha256 \
          \) -print -quit | grep -q .; then
            echo "::error::raw Harbor or auth material reached the share bundle"
            exit 1
          fi

      - name: Record the evidence label this run may claim
        if: always()
        run: |
          echo "::notice::evidence label: ${{ needs.preflight.outputs.evidence_label }}"
          echo "::notice::a single smoke rollout supports case diagnosis only; the report renderer rejects comparative claims at R0"

      - name: Upload the shareable normalized evidence only
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: success()
        with:
          name: agent-evidence-oragentbench
          # The exporter uses a fixed allowlist. Raw jobs/, trajectories,
          # logs, verifier bundles and auth material stay on the runner.
          path: out/share/**
          retention-days: 14
          if-no-files-found: error

  agent-frontieror:
    # Real cost, and only on a performance-isolated runner. FrontierOR's score
    # contains a speed term measured as trusted-host wall clock: a run on a
    # co-tenanted machine does not produce a weaker number, it produces a
    # differently-defined one.
    needs: preflight
    if: needs.preflight.outputs.run_agent_fo == 'true'
    environment: benchmark-agent
    runs-on: [self-hosted, orbench-exec, perf-isolated]
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Fail closed on missing secrets, licence, images or isolation
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          missing=0
          [ -n "${OPENROUTER_API_KEY:-}" ] || { echo "::error::repository secret OPENROUTER_API_KEY is not configured"; missing=1; }
          if [ -z "${GRB_LICENSE_FILE:-}" ] || [ ! -f "${GRB_LICENSE_FILE:-/nonexistent}" ]; then
            echo "::error::GRB_LICENSE_FILE must point at a readable Gurobi licence on this runner"
            missing=1
          fi
          # Performance isolation is a property of the machine, not of a label.
          if [ "${ORBENCH_PERF_ISOLATED:-false}" != "true" ]; then
            echo "::error::FrontierOR scores runtime; this runner does not declare ORBENCH_PERF_ISOLATED=true"
            echo "::error::a number produced here would not be an official score"
            missing=1
          fi
          command -v docker >/dev/null 2>&1 || { echo "::error::docker is not available on this runner"; missing=1; }
          for image in frontieror-candidate:1 frontieror-coral-agent:0.1 frontieror-coral-model-proxy:0.1; do
            if ! docker image inspect "$image" >/dev/null 2>&1; then
              echo "::error::container image $image has not been built; see docs/integrations.md"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: Install package and clone the pinned upstream commit
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install -e .
          bash .github/scripts/clone-upstream.sh frontieror upstream

      - name: Run the official trusted-agent evaluation
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PAPER_ID: ${{ inputs.paper_id }}
          PRIMARY_MODEL: ${{ inputs.primary_model }}
          STAGE1_INSTANCES: ${{ needs.preflight.outputs.stage1_instances }}
          DEV_SET: ${{ needs.preflight.outputs.dev_set }}
          TEST_SET: ${{ needs.preflight.outputs.test_set }}
          RUN_ID: ${{ inputs.run_id }}
          ACKNOWLEDGE_COST: ${{ inputs.acknowledge_cost }}
        run: |
          set -euo pipefail
          mkdir -p out
          read -r -a stage1_array <<< "$STAGE1_INSTANCES"
          read -r -a dev_array <<< "$DEV_SET"
          read -r -a test_array <<< "$TEST_SET"
          # The script validates the paper id and instance split against the
          # checkout, refuses any flag from upstream's fixed trusted profile,
          # and then invokes `python -m frontieror.infra agent`. Upstream
          # appends coral / docker isolation / staged_qte / proxied model
          # access / anti-hack itself.
          python3 tools/run_benchmark_smoke.py frontieror \
            --source upstream/FrontierOR \
            --paper-id "$PAPER_ID" \
            --primary-model "$PRIMARY_MODEL" \
            --stage1-instances "${stage1_array[@]}" \
            --dev-set "${dev_array[@]}" \
            --test-set "${test_array[@]}" \
            --run-id "$RUN_ID" \
            --receipt out/agent-receipt.json \
            --execute --acknowledge-cost "$ACKNOWLEDGE_COST"

      - name: Record what this run may and may not claim
        if: always()
        run: |
          echo "::notice::official FrontierOR scoring requires unpublished server-only final instances"
          echo "::notice::a run against the public dataset is an integration test, not a leaderboard score"

      - name: Upload the sanitized receipt only
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: agent-receipt-frontieror
          path: out/agent-receipt.json
          retention-days: 14
          if-no-files-found: warn
