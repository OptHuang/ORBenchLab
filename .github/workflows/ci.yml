name: ci

# Static, deterministic, and free. Runs on GitHub-hosted runners, uses no
# secrets, makes no model calls and executes no benchmark. Anything that needs a
# credential, a licence or a container belongs in another workflow.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Unit, schema and golden tests
        run: python -m pytest -q

      - name: CLI smoke — registry and schemas
        run: |
          orbench --version
          orbench integrations list
          orbench integrations list --json > /tmp/integrations.json
          python -c "import json;d=json.load(open('/tmp/integrations.json'));assert len(d['integrations'])==2,d"
          orbench schema list

      - name: Schema — shipped fixtures validate
        run: |
          for fixture in fixtures/normalized/*.json; do
            orbench schema validate "$fixture" --schema normalized_rollout.schema.json
          done

      - name: Campaign — shipped specs validate or fail for a stated reason
        run: |
          orbench campaign validate campaigns/oragentbench-controls.yaml
          # This one must be rejected: FrontierOR scores runtime and the shipped
          # site is shared. A silent pass here would mean the guard is gone.
          if orbench campaign validate campaigns/frontieror-contract-check.yaml; then
            echo "::error::performance-scored campaign was accepted on a shared site"
            exit 1
          fi

      - name: Plan determinism — same spec must compile byte-identically
        run: |
          orbench campaign plan campaigns/oragentbench-controls.yaml --out /tmp/plan-a
          orbench campaign plan campaigns/oragentbench-controls.yaml --out /tmp/plan-b
          diff -r /tmp/plan-a /tmp/plan-b
          orbench schema validate /tmp/plan-a/plan_ledger.json --schema plan_ledger.schema.json

      - name: Report golden — rebuild from fixtures and compare
        run: |
          orbench report build \
            --input fixtures/normalized/oragentbench-controls.json \
            --out /tmp/report-controls
          diff /tmp/report-controls/summary.md tests/golden/oragentbench-controls.summary.md
          orbench report build \
            --input fixtures/normalized/oragentbench-smoke-r0.json \
            --out /tmp/report-smoke
          diff /tmp/report-smoke/summary.md tests/golden/oragentbench-smoke-r0.summary.md

      - name: Evidence gate — a single-rollout slice may not render as validated
        run: |
          # Fails closed with exit code 4 because the smoke slice is R0.
          if orbench report build \
              --input fixtures/normalized/oragentbench-smoke-r0.json \
              --out /tmp/report-gate --require-label validated; then
            echo "::error::an R0 slice was allowed to render as validated"
            exit 1
          fi

  workflow-hygiene:
    # Guards that keep this repository's own CI honest. Kept separate from the
    # test matrix so a hygiene failure is legible at a glance.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Workflow and repository guards
        run: python -m pytest tests/test_workflows.py tests/test_no_reimplementation.py -q
