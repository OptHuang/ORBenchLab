candidate_schema: orbenchlab.task-genome-candidate.v0
status: strict-task-local-ready-for-human-review
family: vrp_recovery
title: Multi-agent VRP recovery under a closed-edge event
design_goal: >-
  Test whether an agent can construct and replay feasible multi-vehicle routes,
  preserve frozen actions, repair only an affected vehicle and recompute an
  objective after a deterministic disruption.
source:
  title: Multi-Agent Environments for Vehicle Routing Problems
  url: https://arxiv.org/abs/2411.14411v2
  source_content_digest: sha256:f520d06a280265d8f64927193c85a7b0fa115004699cb409b891ca6afa969f50
  source_packet: artifacts/source-packets/maenvs4vrp-2411.14411.pdf
  usage: conceptual-inspiration-only
task_contract:
  package: examples/tasks/vrp-recovery
  input: data/instance.json and data/events.jsonl
  output: submission/solver.py, initial_routes.json, replans.jsonl, event_audit.json
  verifier: separate no-network pytest with CTRF output
  hard_checks: [assignment closure, capacity, frozen prefixes, closed edges, causal scope, objective recomputation]
acceptance:
  hard: [oracle smoke passes, six mutation controls are rejected, static gate has no fail]
  evidence:
    minimum_seeds_per_cell: 3
    minimum_difficulty_levels: 3
    minimum_agent_systems: 2
    required_evidence_level: E3
difficulty_axes:
  customer_count:
    levels: [4, 6, 8]
    meaning: number of service requests
    expected_direction: harder_with_larger_value
  vehicle_count:
    levels: [2, 2, 3]
    meaning: fleet size and capacity coupling
    expected_direction: measure_not_assume
  seed:
    levels: [1, 2, 3]
    meaning: deterministic replication seed, not a difficulty claim
    expected_direction: measure_stability
interventions:
  adapter_shape: restart-with-hint
  hint_ladder: [null-intervention]
screening_decision_rule:
  keep_if: [oracle smoke passes, mutation rejection rate is 1.0, event or scale gap is replicated]
  otherwise: revise-or-collect-more-evidence
